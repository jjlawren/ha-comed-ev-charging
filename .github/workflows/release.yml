name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Version bump"
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write

jobs:
  release:
    name: Bump and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute new version
        id: bump
        run: |
          current=$(jq -r .version custom_components/comed_ev/manifest.json)
          IFS=. read -r major minor patch <<< "$current"
          case "${{ inputs.release_type }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          new="$major.$minor.$patch"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "Bumping $current -> $new"

      - name: Write version
        env:
          NEW: ${{ steps.bump.outputs.new }}
        run: |
          jq --arg v "$NEW" '.version = $v' custom_components/comed_ev/manifest.json > manifest.tmp
          mv manifest.tmp custom_components/comed_ev/manifest.json
          sed -i -E "0,/^version = \".*\"/s//version = \"$NEW\"/" pyproject.toml

      - name: Commit and tag
        env:
          NEW: ${{ steps.bump.outputs.new }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release v$NEW"
          git tag "v$NEW"
          git push origin HEAD --tags

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: ${{ steps.bump.outputs.new }}
        run: gh release create "v$NEW" --title "v$NEW" --generate-notes
