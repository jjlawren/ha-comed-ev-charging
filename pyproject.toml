[project]
name = "ha-comed-ev-charging"
version = "0.6.1"
description = "Home Assistant custom component to shift EV charging into the cheapest ComEd hours."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["comed-hourly-pricing>=0.1.0"]

[dependency-groups]
dev = [
    "homeassistant>=2024.12",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-homeassistant-custom-component>=0.13",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[tool.mypy]
python_version = "3.13"
